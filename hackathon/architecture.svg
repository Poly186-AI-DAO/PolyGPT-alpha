<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">Poly Autopilot Workforce architecture</title><desc id="desc">Qwen Cloud plans work, Poly routes workers and tools, verification produces a receipt, and external actions require human approval.</desc><style>text{font-family:Arial,sans-serif;fill:#172033}.box{fill:#eef4ff;stroke:#2f5bea;stroke-width:2}.gate{fill:#fff4dc;stroke:#d48806;stroke-width:2}.arrow{stroke:#52627a;stroke-width:2;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#52627a"/></marker></defs><rect width="1200" height="620" fill="#fff"/><text x="60" y="55" font-size="28" font-weight="700">Poly Autopilot Workforce for Qwen Cloud</text><text x="60" y="84" font-size="16">Receipt-first autonomous operations with governed external action</text><rect class="box" x="60" y="140" width="190" height="80" rx="12"/><text x="155" y="175" text-anchor="middle" font-size="18" font-weight="700">Business objective</text><text x="155" y="199" text-anchor="middle" font-size="14">operator input</text><rect class="box" x="320" y="140" width="220" height="80" rx="12"/><text x="430" y="175" text-anchor="middle" font-size="18" font-weight="700">Qwen Cloud planner</text><text x="430" y="199" text-anchor="middle" font-size="14">plan + tool selection</text><rect class="box" x="610" y="120" width="220" height="120" rx="12"/><text x="720" y="158" text-anchor="middle" font-size="18" font-weight="700">Poly worker runtime</text><text x="720" y="184" text-anchor="middle" font-size="14">routing · memory</text><text x="720" y="206" text-anchor="middle" font-size="14">Celery · artifacts</text><rect class="box" x="900" y="120" width="220" height="120" rx="12"/><text x="1010" y="158" text-anchor="middle" font-size="18" font-weight="700">Tools + records</text><text x="1010" y="184" text-anchor="middle" font-size="14">research · CRM</text><text x="1010" y="206" text-anchor="middle" font-size="14">artifact persistence</text><path class="arrow" d="M250 180 H320"/><path class="arrow" d="M540 180 H610"/><path class="arrow" d="M830 180 H900"/><rect class="box" x="270" y="360" width="240" height="100" rx="12"/><text x="390" y="400" text-anchor="middle" font-size="18" font-weight="700">Evidence + verification</text><text x="390" y="426" text-anchor="middle" font-size="14">source checks · receipt</text><rect class="gate" x="650" y="360" width="240" height="100" rx="12"/><text x="770" y="400" text-anchor="middle" font-size="18" font-weight="700">Human approval gate</text><text x="770" y="426" text-anchor="middle" font-size="14">before send / spend</text><rect class="box" x="980" y="360" width="160" height="100" rx="12"/><text x="1060" y="400" text-anchor="middle" font-size="18" font-weight="700">Outcome</text><text x="1060" y="426" text-anchor="middle" font-size="14">receipt or handoff</text><path class="arrow" d="M1010 240 V300 H390 V360"/><path class="arrow" d="M510 410 H650"/><path class="arrow" d="M890 410 H980"/><text x="60" y="545" font-size="15">No credentials or live deployment claims are embedded in this proof bundle.</text></svg>
